# CPA Quota Keeper
#
# Monitoring and Window Ignition are separate:
# - monitor = true: read quota and send notifications
# - ignite = true: start the next 5-hour window after reset

[window_ignition]
enabled = true
start_hour = 7
end_hour = 22
end_grace_minutes = 30
grace_seconds = 3
failure_retry_seconds = 300
post_success_hold_seconds = 60

[providers.codex]
monitor = true
ignite = true
model = ""

[providers.claude]
monitor = true
ignite = true
model = ""
# Only Claude's 5-hour window can be auto-ignited. 7-day/Fable 5 windows are monitor-only.

[providers.antigravity]
monitor = true
ignite = false
model = ""
# By default only the larger Gemini 5-hour bucket is eligible for auto ignition.
# Add "Claude / GPT" explicitly if you really want to ignite that smaller bucket too.
groups = ["Gemini"]

# Antigravity can expose more than one independent 5-hour quota group.
#
# Optional per-group model overrides:
# [providers.antigravity.models]
# "Gemini" = "gemini-3.5-flash-lite"
# "Claude / GPT" = "gpt-oss-120b-medium"

[providers.grok]
monitor = true
ignite = false
model = ""

[codex_reset_updates]
# Poll Did Codex Reset and forward newly published reset signals to Bark.
# Their public API is limited to 20 requests/hour; values below 300s are clamped to 300s.
enabled = false
poll_seconds = 300
# On first enable, notify the currently pending scheduled reset (if any), but not old completed history.
notify_current_pending = true
